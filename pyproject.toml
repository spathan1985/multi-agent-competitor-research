[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-competitor-research"
version = "1.0.0"
description = "Three-agent market research using LangChain, LangGraph, OpenAI and Tavily"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "langgraph==1.2.16",
    "streamlit==1.66.1",
    "langchain==1.4.7",
    "langchain-core==1.7.0",
    "langchain-tavily==0.2.18",
    "langchain-openai==1.7.2",
    "langgraph-checkpoint-sqlite==3.1.2",
    "aiohttp==3.14.5",
]

[tool.setuptools]
py-modules = ["app", "tavily_tools"]
